<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alpha-16 v7.5 Gemini 3.x Terminal</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#2563eb',
            darkBg: '#0f172a',
            cardBg: '#1e293b',
            borderLine: '#334155'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 flex justify-center min-h-screen text-slate-800 font-sans antialiased">

  <div class="w-full max-w-md bg-white min-h-screen flex flex-col shadow-2xl relative pb-10">

    <!-- 1. Top Header Banner -->
    <header class="bg-darkBg text-white p-5 rounded-b-3xl shadow-lg relative">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center space-x-2">
          <span class="text-xl">🏛️</span>
          <h1 class="font-bold text-lg tracking-tight">Alpha-16 v7.5 Master</h1>
        </div>
        
        <!-- Gemini 3.x 전용 모델 선택 드롭다운 -->
        <select id="modelSelector" class="bg-slate-800 text-emerald-400 border border-slate-700 text-xs rounded-lg px-2 py-1 focus:outline-none font-semibold">
          <option value="gemini-3.7-flash" selected>🚀 3.7 Flash (최신)</option>
          <option value="gemini-3.5-flash">✨ 3.5 Flash</option>
          <option value="gemini-3-flash-preview">⚡ 3 Flash Preview</option>
          <option value="gemini-3.5-flash-lite">⚡ 3.5 Flash-Lite (초고속)</option>
          <option value="gemini-3.1-pro-preview">🧠 3.1 Pro (정밀추론)</option>
        </select>
      </div>

      <!-- Quick Ticker & Search -->
      <div class="bg-cardBg rounded-2xl p-3 border border-borderLine space-y-2">
        <div class="flex items-center bg-slate-900 rounded-xl px-3 py-2 border border-slate-700">
          <i class="fa-solid fa-magnifying-glass text-slate-400 mr-2 text-sm"></i>
          <input id="stockInput" type="text" placeholder="종목명 또는 티커 (예: 삼성전자, NVDA, SK하이닉스)" value="삼성전자"
                 class="w-full bg-transparent text-white text-sm focus:outline-none placeholder-slate-500" />
          <button onclick="runGemini3Analysis()" id="analyzeBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg ml-2 transition">
            분석
          </button>
        </div>

        <!-- Quick Tag Selectors -->
        <div class="flex space-x-1.5 overflow-x-auto text-xs py-1 text-slate-300 no-scrollbar">
          <button onclick="setStock('삼성전자')" class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-slate-700">삼성전자</button>
          <button onclick="setStock('SK하이닉스')" class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-slate-700">SK하이닉스</button>
          <button onclick="setStock('NVDA')" class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-slate-700">엔비디아</button>
          <button onclick="setStock('TSM')" class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-slate-700">TSMC</button>
          <button onclick="setStock('AAPL')" class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full whitespace-nowrap hover:bg-slate-700">애플</button>
        </div>
      </div>
    </header>

    <!-- 2. Main Content Area -->
    <main class="p-4 space-y-4 flex-1">

      <div class="flex bg-slate-200 p-1 rounded-xl text-xs font-medium text-slate-600">
        <button onclick="switchTab('tab-report')" id="btn-tab-report" class="flex-1 py-1.5 bg-white text-blue-600 font-bold rounded-lg shadow-sm transition">Alpha-16 실시간 리포트</button>
        <button onclick="switchTab('tab-stop')" id="btn-tab-stop" class="flex-1 py-1.5 hover:text-slate-900 transition">자금관리/스탑</button>
        <button onclick="switchTab('tab-settings')" id="btn-tab-settings" class="flex-1 py-1.5 hover:text-slate-900 transition">설정</button>
      </div>

      <!-- TAB 1: Gemini 3.x Real-Time Report Output -->
      <section id="tab-report" class="space-y-3">
        <div id="reportCard" class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
          <div class="flex justify-between items-center border-b border-slate-100 pb-2">
            <span id="reportHeaderTitle" class="font-bold text-sm text-slate-800">📊 대기 중</span>
            <span id="reportStatusBadge" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold">대기</span>
          </div>

          <div id="streamTextOutput" class="text-xs text-slate-700 leading-relaxed font-sans min-h-[120px]">
            상단에서 종목명을 입력하고 [분석]을 누르면 Gemini 3세대 최신 엔진이 9단계 리포트를 생성합니다.
          </div>
        </div>
      </section>

      <!-- TAB 2: Dynamic Stop -->
      <section id="tab-stop" class="hidden space-y-3">
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
          <h3 class="font-bold text-sm text-slate-800 flex items-center">
            <i class="fa-solid fa-shield-halved text-blue-600 mr-2"></i> [Step 5] 기계적 트레일링 스탑 계산기
          </h3>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div>
              <label class="text-slate-500 block mb-1">내 매수 단가 ($ 또는 원)</label>
              <input id="inBuyPrice" type="number" value="100" oninput="calcStopRules()" class="w-full border border-slate-300 rounded-lg p-2 font-bold text-slate-800" />
            </div>
            <div>
              <label class="text-slate-500 block mb-1">매수 후 최고가 ($ 또는 원)</label>
              <input id="inPeakPrice" type="number" value="120" oninput="calcStopRules()" class="w-full border border-slate-300 rounded-lg p-2 font-bold text-slate-800" />
            </div>
          </div>

          <div class="space-y-2 pt-2 text-xs">
            <div class="bg-rose-50 border border-rose-200 p-3 rounded-xl flex justify-between items-center">
              <div>
                <b class="text-rose-700">1차 스탑 (-10%)</b>
                <p class="text-slate-500">30% 분할 익절</p>
              </div>
              <span id="stop1Price" class="font-bold text-rose-700 text-sm">$108.00</span>
            </div>
            <div class="bg-rose-50 border border-rose-200 p-3 rounded-xl flex justify-between items-center">
              <div>
                <b class="text-rose-700">2차 스탑 (-20%)</b>
                <p class="text-slate-500">50% 추가 익절</p>
              </div>
              <span id="stop2Price" class="font-bold text-rose-700 text-sm">$96.00</span>
            </div>
            <div class="bg-rose-100 border border-rose-300 p-3 rounded-xl flex justify-between items-center">
              <div>
                <b class="text-rose-800">3차 스탑 (-30%)</b>
                <p class="text-slate-600">전량 청산 (현금화)</p>
              </div>
              <span id="stop3Price" class="font-bold text-rose-800 text-sm">$84.00</span>
            </div>
          </div>
        </div>
      </section>

      <!-- TAB 3: Settings -->
      <section id="tab-settings" class="hidden space-y-3">
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
          <h3 class="font-bold text-sm text-slate-800 flex items-center">
            <i class="fa-solid fa-key text-blue-600 mr-2"></i> Gemini API Key 설정
          </h3>
          <input id="userApiKey" type="password" placeholder="AIzaSy..." class="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:outline-none focus:border-blue-500" />
          <button onclick="saveApiKey()" class="w-full bg-slate-900 text-white text-xs font-semibold py-2 rounded-lg hover:bg-slate-800 transition">키 영구 저장</button>
        </div>
      </section>

    </main>
  </div>

  <script>
    function switchTab(tabId) {
      ['tab-report', 'tab-stop', 'tab-settings'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
        document.getElementById(`btn-${id}`).className = 'flex-1 py-1.5 text-slate-600 hover:text-slate-900 transition';
      });
      document.getElementById(tabId).classList.remove('hidden');
      document.getElementById(`btn-${tabId}`).className = 'flex-1 py-1.5 bg-white text-blue-600 font-bold rounded-lg shadow-sm transition';
    }

    function setStock(ticker) {
      document.getElementById('stockInput').value = ticker;
      runGemini3Analysis();
    }

    function saveApiKey() {
      const key = document.getElementById('userApiKey').value.trim();
      if(key) {
        localStorage.setItem('GEMINI_API_KEY', key);
        alert('API Key가 안전하게 저장되었습니다.');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('GEMINI_API_KEY');
      if (savedKey) document.getElementById('userApiKey').value = savedKey;
      calcStopRules();
    });

    function calcStopRules() {
      const buy = parseFloat(document.getElementById('inBuyPrice').value) || 0;
      const peak = parseFloat(document.getElementById('inPeakPrice').value) || 0;

      document.getElementById('stop1Price').innerText = (peak * 0.90).toFixed(2);
      document.getElementById('stop2Price').innerText = (peak * 0.80).toFixed(2);
      document.getElementById('stop3Price').innerText = (peak * 0.70).toFixed(2);
    }

    // Gemini 3세대(3.x) 전용 실행 엔진
    async function runGemini3Analysis() {
      const ticker = document.getElementById('stockInput').value.trim();
      const apiKey = localStorage.getItem('GEMINI_API_KEY') || document.getElementById('userApiKey').value.trim();
      const primaryModel = document.getElementById('modelSelector').value;

      if (!apiKey) {
        alert('설정 탭에서 Gemini API Key를 먼저 입력해주세요.');
        switchTab('tab-settings');
        return;
      }

      if (!ticker) {
        alert('종목명을 입력해주세요.');
        return;
      }

      const reportHeaderTitle = document.getElementById('reportHeaderTitle');
      const reportStatusBadge = document.getElementById('reportStatusBadge');
      const streamTextOutput = document.getElementById('streamTextOutput');

      reportHeaderTitle.innerText = `📊 ${ticker} Gemini 3세대 연산 중...`;
      reportStatusBadge.className = 'text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold animate-pulse';
      reportStatusBadge.innerText = `${primaryModel} 구동 중`;
      streamTextOutput.innerHTML = '<div class="text-center py-6 text-slate-400 space-y-2"><i class="fa-solid fa-spinner fa-spin text-2xl text-blue-600"></i><p>Gemini 3세대 최신 엔진으로 9단계 리포트를 생성하고 있습니다...</p></div>';

      const prompt = `
너는 기업 펀더멘털 분석 및 기계적 자금 관리 시스템인 'Alpha-16 v7.5' 전문 분석가다.
종목 [${ticker}]에 대하여, 아래 [Alpha-16 v7.5 정규 파이프라인 규격]의 Step 0 ~ Step 8을 단 한 단계도 축약하거나 생략하지 말고 모두 온전히 전개하라.

======================================================================
[Alpha-16 v7.5 정규 마스터 파이프라인 규격]
======================================================================
[Step 0] 실시간 다중 채널 교차 검증
 • 최신 기준가, 52주 최고/최저가, 고점 대비 괴리율(%), PER/PBR/ROE, 최신 실적 공시(매출, 영업이익, OPM), 순현금 체력

[Step 0.5] 산업의 존재 이유 & 숨겨진 본질적 해자 심층 분석
 1. 전방 산업 폭발 동인 및 절대적 병목(Chokepoint) 규명
 2. 고정비 레버리지 & 한계비용 제로 머신 구조
 3. 3~5년 다년 LTA 수주형 산업 전환 여부
 4. 피지컬 AI(자율주행/로봇) 거대 TAM 확장성
 5. 숨겨진 본질적 해자 및 경쟁사 대비 매트릭스

[Step 0.8] 거시경제·정치·지정학적 리스크 및 포트폴리오 헷지 분석
 1. 미중 패권 갈등 및 관세/수출 통제
 2. 공급망 재편 및 글로벌 금리 압박
 3. Alpha-16 모델의 3중 방어 헷지

[Step 1] 4대 축 16개 핵심 팩터 정밀 평가 (80점 만점 매트릭스)
 • 경제적 해자(4개), 성장 동력(4개), 재무 품질(4개), 거버넌스&외생(4개)
 • Moat 총점(80점 만점) 및 등급 도출

[Step 2] 비선형 퀀텀점프 3대 게이트 (Gate 1~3 Pass/Fail)
[Step 3] 포트폴리오 5대 슬롯 자산배분 & 가변 스탑 판정 (Slot 1~5)
[Step 4] 시나리오별 3대 적정 가치 밴드 (Bull / Base / Bear)
[Step 5] 실전 매매 프로토콜 (Free-Ride선 및 -10%/-20%/-30% 트레일링 스탑선)
[Step 6] 손절/청산 후 뇌동매매 차단 재진입 게이트 (Gate R-1 ~ R-3)
[Step 7] 정밀 백테스팅 검증
[Step 8] 최종 투자 결론 및 실전 행동 지침 (종합 등급, 즉각 실행 액션, 상방 목표가, One-Line Verdict)
======================================================================
`;

      // Gemini 3.x 세대 전용 호출 리스트 (2.x / 1.5 완전 배제)
      const gemini3Models = [
        primaryModel,
        'gemini-3.7-flash',
        'gemini-3.5-flash',
        'gemini-3-flash-preview',
        'gemini-3.5-flash-lite',
        'gemini-3.1-pro-preview'
      ];

      // 중복 제거
      const modelQueue = [...new Set(gemini3Models)];
      let success = false;
      let errorMsg = '';

      for (const model of modelQueue) {
        try {
          reportStatusBadge.innerText = `${model} 시도 중`;
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ role: 'user', parts: [{ text: prompt }] }]
            })
          });

          const data = await response.json();

          if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
            let textResult = '';
            data.candidates[0].content.parts.forEach(p => {
              if (p.text) textResult += p.text;
            });

            streamTextOutput.innerHTML = textResult
              .replace(/\*\*(.*?)\*\*/g, '<b class="text-slate-900">$1</b>')
              .replace(/### (.*?)\n/g, '<h4 class="font-bold text-blue-600 text-sm mt-3 mb-1">$1</h4>')
              .replace(/\[Step (.*?)\]/g, '<div class="bg-blue-50 text-blue-700 font-bold px-2 py-0.5 rounded text-xs inline-block my-1 border border-blue-200">Step $1</div>')
              .replace(/\n/g, '<br/>');

            reportHeaderTitle.innerText = `📊 ${ticker} 분석 완료`;
            reportStatusBadge.className = 'text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold';
            reportStatusBadge.innerText = `${model} 연동 완료`;
            success = true;
            break;
          } else if (data.error) {
            errorMsg = data.error.message;
          }
        } catch (e) {
          errorMsg = e.message;
        }
      }

      if (!success) {
        streamTextOutput.innerHTML = `<div class="bg-rose-50 border border-rose-200 p-3 rounded-xl text-xs text-rose-700 font-medium">연결 실패: ${errorMsg}</div>`;
        reportStatusBadge.className = 'text-xs bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full font-bold';
        reportStatusBadge.innerText = '실패';
      }
    }
  </script>
</body>
</html>
